





<div  class="container-fluid attachment-page" >
 <div *ngIf="showSpiner" class="spinner-container">
  <app-spinner></app-spinner>
</div>
  <!-- <a routerLink ="/policy"><i class="fa fa-angle-double-left" aria-hidden="true"></i> BACK TO</a> -->
 



 
  
 
   <div class="row mt-2" *ngIf="!showSpiner">
  
    
   
    <div class="col-sm-4">
         <div class="search-box">
      <i class="fa fa-search"></i>
      <input 
        type="search" 
        class="form-control"
        placeholder="Search by File Name..."
        [(ngModel)]="searchTerm"

      />
      <button class="btn-search">Search</button>
    </div>
  

    </div>
     <div class="col-sm-4">
      
    </div>

     <div class="col-sm-4 text-end" >
       
    <button class="btn btn-add" (click)="openAttachmentDialog()">
      <i class="fa fa-plus me-1"></i> ATTACHMENT  HERE
    </button>

 
    </div>
   </div>
    <div class="table-container shadow-sm mt-2">
  <div class="table-header">
    <h5 class="mb-0">DRIVER FILE</h5>
  </div>

   
     <div class="scrollingPolicy">
    <table class="table custom-table">
             <thead >
               <tr>
                <th >Description</th>
                 <th >File Path</th>
                 
                 <th ></th>
                 <th ></th>
                 <th ></th>
                  
<th ></th>
            

                 
                 
                 
                 
               
                
               </tr>
             </thead>
             <tbody>
            <tr
        *ngFor="let data of filteredAttachments"
        (dblclick)="onRowClick(data)"
        [ngClass]="{ 'deleted-row': data.IsDeleted }"
        style="cursor: pointer"
      >
        <td>{{ data.DriverDescription || '—' }}</td>
        <td>{{ data.FileName }}</td>
      
        
        <td>{{ data.AttachmentDate | date:'MM/dd/yyyy' }}</td>
        <td>{{ data.EnteredBy }}</td>
        <td>
  <span [ngClass]="data.Remarks == 'true' ? 'text-success' : 'text-danger'">
    {{ data.Remarks == 'true' ? '✔' : '-' }}
  </span>
</td>
        <td>
          <button matIconButton  [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu" >
  <mat-icon>more_vert</mat-icon>
</button>
<mat-menu #menu="matMenu" >
   <button mat-menu-item  (click)="deleteData(data,'DELETE')">
    <mat-icon>check</mat-icon>
    <span>DELETE</span>
  </button>
  <button mat-menu-item  (click)="deleteData(data,'PERMANENT')">
    <mat-icon>add</mat-icon>
    <span>DELETE  PERMANENTLY</span>
  </button>
  
  
  
   
 
</mat-menu>
        </td>
      </tr>

      <tr *ngIf="filteredAttachments.length === 0">
        <td colspan="7" class="text-center text-muted">
          No records found
        </td>
      </tr>
             </tbody>
           </table>
     </div>
   
  
 
</div>
