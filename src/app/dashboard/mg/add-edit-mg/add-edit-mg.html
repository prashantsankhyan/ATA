<div class="container-fluid" style="background-color: white;">

  <!-- 🔄 Spinner -->
 

  <form [formGroup]="addEditBrokerForm" (ngSubmit)="onSubmit()">

    <div class="row g-1 mt-1">

      <!-- Broker -->
      <div class="col-12">
        <label class="form-label">Broker *</label>
        <input type="text" class="form-control"
               formControlName="AccountName">
        <div class="text-danger" *ngIf="submit && f['AccountName'].errors">
          Broker Name is required
        </div>
      </div>

      <!-- Lookup -->
      <div class="col-12">
        <label class="form-label">LookUp Code</label>
        <input type="text" class="form-control"
               formControlName="LookUpCode">
      </div>

      <!-- Address -->
      <div class="col-12">
        <label class="form-label">Address</label>
        <textarea class="form-control"
                  formControlName="Address1"
                  rows="2"></textarea>
      </div>

      <!-- ZIP -->
      <div class="col-sm-6">
        <label class="form-label">ZIP</label>
        <input type="text" class="form-control"
               formControlName="ZipCode">
      </div>

      <!-- Number -->
      <div class="col-sm-6">
        <label class="form-label">Number</label>
        <input type="text" class="form-control"
               formControlName="PrimaryNumber">
      </div>

      <!-- Email -->
      <div class="col-12">
        <label class="form-label">Email</label>
        <input type="email" class="form-control"
               formControlName="PrimaryEmailAddress">
      </div>

      <!-- Description -->
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control"
                  formControlName="WebsiteDescription"
                  rows="2"></textarea>
      </div>

    </div>

    <!-- Buttons -->
    <div class="text-end mt-4 mb-2">
      <button type="submit" class="btn  btn-sm me-2" style="background-color: #232324c0; color: white;">
        ADD MG
      </button>

      <button type="button"
              class="btn btn-danger btn-sm"
              (click)="closeModel()">
        CLOSE
      </button>
    </div>

  </form>

</div>
