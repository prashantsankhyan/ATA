

   
   <div class="container-fluid" >
     <div *ngIf ="!showFiv">
     <h5>File Size is  Big sow it will take some time to Upload</h5>
    
   </div>
   <h4 style="text-align: center;"> Account Name  : {{accountName}}</h4>
    <div class=" " *ngIf ="showFiv">
    
 
       
         <form [formGroup] ="addEditAttachmentForm"> 
             <div class="row">
               <mat-form-field appearance="outline" class="w-100 ">
      <mat-label>Finance Section</mat-label>
      <mat-select formControlName="PolicyType">
        <mat-option value="Initial Finance">Initial Finance</mat-option>
        <mat-option value="AP Finance">AP Finance</mat-option>
      </mat-select>
    </mat-form-field>
              <div class=""> 
               <mat-form-field appearance="outline" class="w-100">
      <mat-label>Endorsement Section</mat-label>
      <mat-select formControlName="TransactionType">
        <mat-option value="AL">AL</mat-option>
        <mat-option value="PD">PD</mat-option>
        <mat-option value="MTC">MTC</mat-option>
        <mat-option value="GL">GL</mat-option>
        <mat-option value="AL&PD">AL & PD</mat-option>
        <mat-option value="PD&MTC">PD & MTC</mat-option>
        <mat-option value="AL&PD&MTC">AL & PD & MTC</mat-option>
      </mat-select>
    </mat-form-field>
             </div>
          
                  
                 <div class="col-sm-12">
                     <label>Upload file here</label>
                     <div class=" file-container center  text-center " >
                         
                        <label>Upload file here</label>
                        <input
                        type="file"
                        class="file"
                        placeholder="File Name"
                        multiple
                        accept=".xlsx,.xls,image/*,.doc, .docx,.ppt, .pptx,.txt,.pdf,.wav"        
                        (change)= "onFileUpload($event)"  [ngClass]= "{ 'is-invalid': submit && f['abc'].errors }" />
                        <div *ngIf ="submit && f['abc'].errors" class="invalid-feedback">
                            <div *ngIf ="f['abc'].errors">FIle is required</div>
                        </div>
                        <label>Upload file here</label>
                    </div>
                 </div>
                  
                    
             <div *ngIf ="files">
                 {{files.name}}
              
             </div>
             <div class="mt-3 mb-3"> 
           <mat-form-field appearance="outline" class="w-100 custom-textarea">

  <mat-label>
    <mat-icon class="me-1">description</mat-icon>
    Description
  </mat-label>

  <textarea
    matInput
    formControlName="Description"
    rows="3"
    placeholder="Write a short description..."
    maxlength="200">
  </textarea>




</mat-form-field>
                
             </div>


           

            
                     
               
             </div>
         
            
         </form>
      
    
     
   </div>
      <div class="text-center ">
         <div >
         <!-- Buttons -->
  <div class="text-center ">
    <button
      mat-raised-button
     
      style="width:120px;background: linear-gradient(45deg, rgba(35, 35, 36, 0.7529411765), rgba(35, 35, 36, 0.7529411765));; color: white;"
      (click)="onSubmit()"
      
    >
      SAVE
    </button>

    <button
      mat-raised-button
      color="warn"
      style="width:120px; margin-left:10px;background: linear-gradient(45deg, red, rgba(36, 35, 36, 0.905));color: white;"
      mat-dialog-close
    >
      CANCEL
    </button>
           
           </div>
       </div>
     
      
     
     </div>

</div>
