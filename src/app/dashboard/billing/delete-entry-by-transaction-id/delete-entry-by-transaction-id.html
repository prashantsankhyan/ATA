<div class="container d-flex justify-content-center align-items-center" style="height:80vh;">
  <div class="card shadow-lg border-0" style="max-width:500px; width:100%;">
    <div class="card-body text-center p-5">

      <div class="mb-3">
        <i class="fas fa-trash-alt text-danger" style="font-size:70px;"></i>
      </div>

      <h3 class="text-danger fw-bold">Delete Confirmation</h3>

      <p class="text-muted mt-3">
        Are you sure you want to delete this transaction?
      </p>

      <p class="text-danger fw-semibold">
        This action cannot be undone.
      </p>

      <div class="mt-4 d-flex justify-content-center gap-3">
        <button class="btn btn-danger px-4" (click)="getAllPolicyListByAccontId()">
          <i class="fas fa-trash"></i> Delete
        </button>

        <button class="btn btn-secondary px-4" (click)="closeDialog()" >
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>

    </div>
  </div>
</div>
