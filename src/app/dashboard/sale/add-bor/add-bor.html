
<div class="container">
 <div *ngIf ="!showFiv">
     <h5>File Size is  Big sow it will take some time to Upload</h5>
    <div  class="spinner-overlay">
  <div class="spinner"></div>
</div>
   </div>
  
  
   
    <div class="container-fluid " *ngIf ="showFiv" style="background-color: white;">
     <h5 style="text-align: center; background-color: white;color: rgba(0, 0, 0, 0.445);margin-top: 5px;"> Account Name  : {{AccountName}}</h5>
 
       <mat-dialog-content>
         <form [formGroup] ="addEditAttachmentForm"> 
             <div class="row ">
            
                 
                 <div class="col-sm-12 ">
                     <label>Upload file here</label>
                     <div class=" file-container center  text-center mt-2" >
                         
                         <label>Upload file here</label>
                         <input
                         type="file"
                         class="file"
                         placeholder="File Name"
                         multiple
                         accept=".xlsx,.xls,image/*,.doc, .docx,.ppt, .pptx,.txt,.pdf,.wav"
                         
                         (change)= "onFileUpload($event)"  [ngClass]= "{ 'is-invalid': submit && f['abc'].errors }" />
                         <div *ngIf ="submit && f['abc'].errors" class="invalid-feedback">
                             <div *ngIf ="f['abc'].errors">FIle is required</div>
                         </div>
                         <label>Upload file here</label>
                     </div>
                 </div>
                  
                    
             <div *ngIf ="files">
                 {{files.name}}
              
             </div>
             <div class="mt-3 mb-1"> 
                 <label>Description</label>
                 <textarea class="form-control" rows="2"formControlName="Description"></textarea>
             
                 <div *ngIf ="submit && f['Description'].errors" class="invalid-feedback">
                     <div *ngIf ="f['Description'].errors">Description is required</div>
                 </div>
                 
             </div>

                <div class="col-md-4"> 
                 <label>Date</label>
                 <input type="text"
       class="form-control form-control-sm custom-input"
       formControlName="AttachmentDate"
       placeholder="MM-DD-YYYY">
                 
             </div>
                    
             
              <div class="col-md-8">
  <label>Agent Name</label>

<select class="form-select form-control form-control-sm custom-input" formControlName="AgentID"  [ngClass]= "{ 'is-invalid': submit && f['agentID'].errors }">
  <option value="">Select</option>
  <option *ngFor="let a of listOfAgent" [value]="a.AgentID.toString()">
    {{ a.AgentName }} - ({{a.AgencyName}}) -{{a.AgentCode}}
  </option>
</select>
  <div *ngIf ="submit && f['agentID'].errors" class="invalid-feedback">
                         <div *ngIf ="f['agentID'].errors">DriverName is required</div>
                     </div>
</div>
               
             </div>
         
            
         </form>
      </mat-dialog-content>
     <mat-dialog-actions class="mat-mdc-dialog-actions-align-end">
        <div class="mt-3 mb-2" style="text-align: right;">
        
            <a href="javascript:void(0)"  (click)="onSubmit();" class="d-none d-sm-inline-block btn btn-sm  shadow-sm me-2" style="background-color: #232324c0;color: white;"><i class="fas fa-check fa-sm text-white-50"></i> ADD ATTACHMENT</a>
            <a href="javascript:void(0)"  class="d-none d-sm-inline-block btn btn-sm btn-danger shadow-sm"  mat-dialog-close><i class="fas fa-times fa-sm text-white-50"></i> CANCEL</a>

       </div>
     
       </mat-dialog-actions>
     
     </div>
   

</div>
