<div class="confirm-dialog">

  <div class="confirm-header">
    <div class="icon-circle">
      <i class="fa fa-check"></i>
    </div>

    <h3>Confirm Update</h3>

    <p>
      Are you sure you want to update this BOR record?
      <br>
      This action will save the latest changes.
    </p>
  </div>

  <div class="confirm-body">

    <div class="alert alert-light border">
      <strong>Note:</strong><br>
      Please verify the information before continuing.
    </div>

  </div>

  <div class="confirm-footer">

    <button class="btn btn-light btn-lg px-4 me-2">
      Cancel
    </button>

    <button class="btn btn-success btn-lg px-4"(click)="confirn()">
      <i class="fa fa-check me-2"></i>
      Confirm
    </button>

  </div>

</div>
